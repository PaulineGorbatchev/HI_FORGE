name: Publish Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push docs to GitHub Wiki
        run: |
          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"

          # Try to clone; if the wiki doesn't exist yet, initialise it
          if ! git clone "$WIKI_URL" wiki 2>/dev/null; then
            mkdir wiki
            cd wiki
            git init
            git remote add origin "$WIKI_URL"
            # Create a placeholder Home page so the wiki exists before we push
            echo "# HIcrafter Wiki" > Home.md
            git add Home.md
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "Initialise wiki"
            git push --set-upstream origin master
            cd ..
          fi

          # Mirror docs/ into the wiki (remove pages that no longer exist in docs/)
          rsync --archive --delete --include="*.md" --exclude="*" docs/ wiki/

          cd wiki
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git diff --cached --quiet || git commit -m "Sync wiki from docs/ [skip ci]"
          git push
